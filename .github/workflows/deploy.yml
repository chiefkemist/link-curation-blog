name: Validate and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true

      - name: Install Fresh dependencies
        run: deno install

      - name: Check formatting
        run: deno fmt --check main.ts client.ts vite.config.ts lib routes

      - name: Type-check Fresh app
        run: deno check main.ts client.ts vite.config.ts lib/posts.ts routes/index.tsx 'routes/posts/[slug].tsx'

      - name: Build Fresh app
        run: deno task build

      - name: Verify Fresh production entrypoint
        run: test -f _fresh/compiled-entry.js

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Verify Deno Deploy production routes
        env:
          BLOG_URL: https://link-curation-blog.outcastgeek-tech.deno.net
        run: |
          for attempt in $(seq 1 150); do
            if home=$(curl --fail-with-body --silent --show-error "$BLOG_URL/"); then
              post_path=$(grep -oE 'href="/posts/[^"]+' <<<"$home" | head -n 1 | cut -d '"' -f 2)
              if [ -n "$post_path" ] && post=$(curl --fail-with-body --silent --show-error "$BLOG_URL$post_path"); then
                if grep -Fq "Link Curation Blog" <<<"$home" && grep -Fq "Source" <<<"$post"; then
                  exit 0
                fi
              fi
            fi
            sleep 2
          done
          echo "Deno Deploy did not serve the Fresh blog within five minutes"
          exit 1
