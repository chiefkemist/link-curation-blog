name: Validate and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true

      - name: Install Fresh dependencies
        run: deno install

      - name: Check formatting
        run: deno fmt --check main.ts client.ts vite.config.ts lib routes

      - name: Type-check Fresh app
        run: deno check main.ts client.ts vite.config.ts lib/posts.ts routes/index.tsx 'routes/posts/[slug].tsx'

      - name: Build Fresh app
        run: deno task build

      - name: Verify Fresh production entrypoint
        run: |
          test -f _fresh/server.js
          deno run -A deploy-entrypoint.ts &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT

          for attempt in $(seq 1 30); do
            if home=$(curl --fail-with-body --silent --show-error http://127.0.0.1:8000/); then
              if post=$(curl --fail-with-body --silent --show-error http://127.0.0.1:8000/posts/010-ai-and-the-university); then
                if [[ "$home" == *"Link Curation Blog"* && "$post" == *"Watch the original video"* ]]; then
                  [[ "$post" == *"markdown-body"* ]]
                  exit 0
                fi
              fi
            fi
            sleep 1
          done

          echo "Fresh production entrypoint did not serve the blog"
          exit 1

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    env:
      DENO_APP_SLUG: link-curation-blog
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build Deno Deploy source request
        env:
          GIT_SHA: ${{ github.sha }}
        run: |
          jq -n --arg sha "$GIT_SHA" \
            '{
              assets: {},
              config: {
                install: "deno install",
                build: "deno task build",
                runtime: {
                  type: "dynamic",
                  entrypoint: "deploy-entrypoint.ts"
                }
              },
              labels: { "custom.git_sha": $sha },
              production: {
                domains: ["link-curation-blog.outcastgeek-tech.deno.net"]
              }
            }' > deploy-payload.json

          for asset in deno.json deno.lock main.ts client.ts vite.config.ts deploy-entrypoint.ts assets/styles.css $(rg --files lib routes posts | sort); do
            content=$(base64 -w0 "$asset")
            jq --arg path "$asset" --arg content "$content" \
              '.assets[$path] = {
                kind: "file",
                encoding: "base64",
                content: $content
              }' deploy-payload.json > deploy-payload.next.json
            mv deploy-payload.next.json deploy-payload.json
          done

      - name: Deploy to Deno Deploy
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
        run: |
          test -n "$DENO_DEPLOY_TOKEN"
          response=$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $DENO_DEPLOY_TOKEN" \
            --header "Content-Type: application/json" \
            --data @deploy-payload.json \
            "https://api.deno.com/v2/apps/$DENO_APP_SLUG/deploy")

          revision_id=$(jq -r '.id // empty' <<<"$response")
          test -n "$revision_id"

          for attempt in $(seq 1 60); do
            revision=$(curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer $DENO_DEPLOY_TOKEN" \
              "https://api.deno.com/v2/revisions/$revision_id")
            status=$(jq -r '.status // empty' <<<"$revision")
            echo "Deno revision $revision_id: $status"

            case "$status" in
              succeeded)
                jq -c '{id, status, config, labels, timelines}' <<<"$revision"
                exit 0
                ;;
              failed|skipped)
                jq -c '{status, failure_reason, failure_detail}' <<<"$revision"
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Timed out waiting for Deno revision $revision_id"
          exit 1

      - name: Verify Deno Deploy production routes
        env:
          BLOG_URL: https://link-curation-blog.outcastgeek-tech.deno.net
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
        run: |
          for attempt in $(seq 1 30); do
            if home=$(curl --fail-with-body --silent --show-error "$BLOG_URL/"); then
              if post=$(curl --fail-with-body --silent --show-error "$BLOG_URL/posts/010-ai-and-the-university"); then
                if [[ "$home" == *"Link Curation Blog"* && "$post" == *"Watch the original video"* && "$post" == *"markdown-body"* ]]; then
                  exit 0
                fi
              fi
            fi
            sleep 2
          done
          echo "Deno Deploy did not serve the Fresh blog within one minute"
          start=$(date -u -d '10 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          end=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $DENO_DEPLOY_TOKEN" \
            "https://api.deno.com/v2/apps/$DENO_APP_SLUG/logs?start=$start&end=$end&limit=100" \
            | jq -c '{logs: [.logs[]? | {timestamp, level, message, revision_id}]}'
          exit 1
