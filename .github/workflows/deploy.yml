name: Validate and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true

      - name: Install Fresh dependencies
        run: deno install

      - name: Check formatting
        run: deno fmt --check main.ts client.ts vite.config.ts deploy-entrypoint.ts lib routes

      - name: Type-check Fresh app
        run: deno check main.ts client.ts vite.config.ts lib/posts.ts routes/index.tsx 'routes/posts/[slug].tsx'

      - name: Build Fresh app
        run: deno task build

      - name: Type-check deploy entrypoint
        run: deno check deploy-entrypoint.ts

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    env:
      DENO_APP_SLUG: link-curation-blog
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true

      - name: Install Fresh dependencies
        run: deno install

      - name: Build Fresh app
        run: deno task build

      - name: Type-check deploy entrypoint
        run: deno check deploy-entrypoint.ts

      - name: Build Deno Deploy v2 request
        env:
          GIT_SHA: ${{ github.sha }}
        run: |
          jq -n --rawfile entrypoint deploy-entrypoint.ts --arg sha "$GIT_SHA" \
            '{
              assets: {
                "deploy-entrypoint.ts": {
                  kind: "file",
                  encoding: "utf-8",
                  content: $entrypoint
                }
              },
              config: {
                runtime: {
                  type: "dynamic",
                  entrypoint: "deploy-entrypoint.ts"
                }
              },
              labels: { "custom.git_sha": $sha },
              production: true
            }' > deploy-payload.json

          for asset in $(rg --files _fresh posts | sort); do
            content=$(base64 -w0 "$asset")
            jq --arg path "$asset" --arg content "$content" \
              '.assets[$path] = {
                kind: "file",
                encoding: "base64",
                content: $content
              }' deploy-payload.json > deploy-payload.next.json
            mv deploy-payload.next.json deploy-payload.json
          done

      - name: Deploy to Deno Deploy
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
        run: |
          test -n "$DENO_DEPLOY_TOKEN"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $DENO_DEPLOY_TOKEN" \
            --header "Content-Type: application/json" \
            --data @deploy-payload.json \
            "https://api.deno.com/v2/apps/$DENO_APP_SLUG/deploy"
