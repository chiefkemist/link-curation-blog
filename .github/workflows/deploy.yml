name: Validate and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: npm ci

      - name: Generate post data
        run: npm run generate

      - name: Build and type-check TanStack Start
        run: |
          npm run build
          npm run check

      - name: Verify TanStack Start production server
        run: |
          test -f .output/server/index.ts
          npm start &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT

          for attempt in $(seq 1 30); do
            if home=$(curl --fail-with-body --silent --show-error http://127.0.0.1:8000/); then
              if post=$(curl --fail-with-body --silent --show-error http://127.0.0.1:8000/posts/010-ai-and-the-university); then
                stylesheet=$(grep -aoE 'href="/assets/styles-[^"]+\.css"' <<<"$home" | head -1 | cut -d'"' -f2)
                css=$(curl --fail-with-body --silent --show-error "http://127.0.0.1:8000$stylesheet" || true)
                if [[ "$home" == *"Useful links,"* && "$post" == *"Watch the original video"* && "$post" == *"markdown-body"* && -n "$stylesheet" && "$css" == *'.btn{'* && "$css" == *'--color-base-100'* ]]; then
                  exit 0
                fi
              fi
            fi
            sleep 1
          done

          echo "TanStack Start production server did not serve the blog"
          exit 1

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    env:
      DENO_APP_SLUG: link-curation-blog
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Generate deployment data
        run: |
          npm ci
          npm run generate

      - name: Build Deno Deploy source request
        env:
          GIT_SHA: ${{ github.sha }}
        run: |
          jq -n --arg sha "$GIT_SHA" \
            '{
              assets: {},
              config: {
                install: "npm ci",
                build: "npm run build",
                runtime: {
                  type: "dynamic",
                  entrypoint: "deploy.ts"
                }
              },
              labels: { "custom.git_sha": $sha },
              production: {
                domains: ["link-curation-blog.outcastgeek-tech.deno.net"]
              }
            }' > deploy-payload.json

          for asset in deno.json deploy.ts package.json package-lock.json tsconfig.json vite.config.ts src/generated-posts.json $(git ls-files src scripts | sort); do
            base64 -w0 "$asset" > asset-content.b64
            jq --arg path "$asset" --rawfile content asset-content.b64 \
              '.assets[$path] = {
                kind: "file",
                encoding: "base64",
                content: $content
              }' deploy-payload.json > deploy-payload.next.json
            mv deploy-payload.next.json deploy-payload.json
          done

      - name: Deploy to Deno Deploy
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
        run: |
          test -n "$DENO_DEPLOY_TOKEN"
          response=$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $DENO_DEPLOY_TOKEN" \
            --header "Content-Type: application/json" \
            --data @deploy-payload.json \
            "https://api.deno.com/v2/apps/$DENO_APP_SLUG/deploy")

          revision_id=$(jq -r '.id // empty' <<<"$response")
          test -n "$revision_id"

          for attempt in $(seq 1 60); do
            revision=$(curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer $DENO_DEPLOY_TOKEN" \
              "https://api.deno.com/v2/revisions/$revision_id")
            status=$(jq -r '.status // empty' <<<"$revision")
            echo "Deno revision $revision_id: $status"

            case "$status" in
              succeeded)
                jq -c '{id, status, config, labels, timelines}' <<<"$revision"
                exit 0
                ;;
              failed|skipped)
                jq -c '{status, failure_reason, failure_detail}' <<<"$revision"
                curl --fail-with-body --silent --show-error \
                  --header "Authorization: Bearer $DENO_DEPLOY_TOKEN" \
                  --header "Accept: application/x-ndjson" \
                  "https://api.deno.com/v2/revisions/$revision_id/build_logs" \
                  | jq -r '.message // .'
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Timed out waiting for Deno revision $revision_id"
          exit 1

      - name: Verify Deno Deploy production routes
        env:
          BLOG_URL: https://link-curation-blog.outcastgeek-tech.deno.net
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
        run: |
          for attempt in $(seq 1 30); do
            if home=$(curl --fail-with-body --silent --show-error "$BLOG_URL/"); then
              if post=$(curl --fail-with-body --silent --show-error "$BLOG_URL/posts/010-ai-and-the-university"); then
                stylesheet=$(grep -aoE 'href="/assets/styles-[^"]+\.css"' <<<"$home" | head -1 | cut -d'"' -f2)
                css=$(curl --fail-with-body --silent --show-error "$BLOG_URL$stylesheet" || true)
                if [[ "$home" == *"Useful links,"* && "$post" == *"Watch the original video"* && "$post" == *"markdown-body"* && -n "$stylesheet" && "$css" == *'.btn{'* && "$css" == *'--color-base-100'* ]]; then
                  exit 0
                fi
              fi
            fi
            sleep 2
          done

          echo "Deno Deploy did not serve the TanStack Start blog within one minute"
          start=$(date -u -d '10 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          end=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $DENO_DEPLOY_TOKEN" \
            "https://api.deno.com/v2/apps/$DENO_APP_SLUG/logs?start=$start&end=$end&limit=100" \
            | jq -c '{logs: [.logs[]? | {timestamp, level, message, revision_id}]}'
          exit 1
